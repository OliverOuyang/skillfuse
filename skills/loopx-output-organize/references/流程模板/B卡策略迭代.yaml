# 流程定义示例：B卡策略迭代
#
# 来源：智能体开发/命名规范/B卡策略迭代项目全景.html（四步全流程 + 推分循环）。
# 步骤编号与名称以原图为准。标了「待核对」的是原图合并显示、这里拆成子节点的项，
# 子项名称按图上文字对应，需业务方确认。
#
# 工具只理解这里的结构，不认识任何 B 卡业务概念；换一个智能体，换一份流程定义即可。

流程: B卡策略迭代
流程版本: 0.1.0

默认:
  基线: 上一版                     # 上一版 | 固定首版 | 无
  门禁结论: [通过, 带问题通过, 整改后复验, 补证后再判]
  跨阶段打回: 需人工确认

执行方取值: [skill, 代码, 人工, 配置, 智能体, 报告整合]

分组:
  - id: "0"
    名称: 共用配置
    说明: 人工确认一次、多个步骤共用；改配置即出新版，用到它的步骤自动过期
    节点:
      - {id: 口径与标签, 执行方: 配置}
      - {id: 新旧版本与对照, 执行方: 配置}
      - {id: 评分方向与分箱, 执行方: 配置}
      - {id: 验收目标, 执行方: 配置}

  - id: "1"
    名称: 主策略复盘
    节点:
      - {id: "1.1", 名称: 范围与版本, 执行方: 人工, 依赖: [口径与标签, 新旧版本与对照]}
      - {id: "1.2", 名称: 业务基线与客群画像, 执行方: skill, 依赖: ["1.1"]}
      - {id: "1.3", 名称: 上轮策略AB验收, 执行方: skill, 依赖: ["1.1"], 可跳过: true}
      - {id: "1.4", 名称: 旧模型综合诊断, 执行方: skill, 依赖: ["1.1"]}
      - {id: "1.报告整合", 执行方: 报告整合, 依赖: ["1.2", "1.3", "1.4"]}
      - id: "1.5"
        名称: 确认迭代目标
        执行方: 人工
        依赖: ["1.报告整合"]
        门禁: true
        可打回至: ["1.2", "1.3", "1.4"]
        交接: 复盘结论

  - id: "2"
    名称: 主B卡开发
    节点:
      - {id: "2.1", 名称: 目标标签与样本, 执行方: 人工, 依赖: ["交接:复盘结论", 口径与标签, 新旧版本与对照]}
      - id: "2.2"
        名称: 主模型开发
        执行方: 代码
        依赖: ["2.1"]
        可外部交付: true                # 由其他团队开发时，本地只做接收与核验
      - id: "2.3-2.8"
        名称: 新旧模型验收评估
        说明: 图上合并显示；验收意见会点名「受影响的评估块」，所以拆成子节点以便局部补证
        节点:
          - {id: "2.3", 名称: 整体性能, 执行方: skill, 依赖: ["2.2", 验收目标], 待核对: true}
          - {id: "2.4", 名称: 分布稳定性, 执行方: skill, 依赖: ["2.2"], 待核对: true}
          - {id: "2.5", 名称: 分组风险, 执行方: skill, 依赖: ["2.2", 评分方向与分箱], 待核对: true}
          - {id: "2.6", 名称: SWAP, 执行方: skill, 依赖: ["2.2", 评分方向与分箱], 待核对: true}
          - {id: "2.7", 名称: 画像倾向, 执行方: skill, 依赖: ["2.2"], 待核对: true}
          - {id: "2.8", 名称: 组内剩余风险, 执行方: skill, 依赖: ["2.2", 评分方向与分箱], 待核对: true}
      - {id: "2.报告整合", 执行方: 报告整合, 依赖: ["2.3", "2.4", "2.5", "2.6", "2.7", "2.8"]}
      - id: "2.9"
        名称: 验收与交接
        执行方: 人工
        依赖: ["2.报告整合", 验收目标]
        门禁: true
        结论:                            # 原文三种验收意见，映射到通用结论
          通过，进入策略分建模: 通过
          需整改后复验: 整改后复验
          证据不足，补齐后判断: 补证后再判
        可打回至: ["2.1", "2.2"]
        可补证至: ["2.3", "2.4", "2.5", "2.6", "2.7", "2.8"]
        交接: 主B卡

  - id: "3"
    名称: 策略分开发
    节点:
      - id: "3.1-3.2"
        名称: 样本与变量准备
        节点:
          - {id: "3.1", 名称: 样本, 执行方: skill, 依赖: ["交接:主B卡"], 待核对: true}
          - {id: "3.2", 名称: 特征池三轮筛选, 执行方: skill, 依赖: ["3.1"], 待核对: true}
      - {id: "3.3", 名称: Python训练策略分, 执行方: 代码, 依赖: ["3.2"]}
      - id: "3.4"
        名称: 策略分组内推分
        执行方: 代码
        依赖: ["3.3"]
        基线: 固定首版                   # 每轮用原始分数 + 当前完整 delta，不在上轮新分上叠加
      - id: "3.5"
        名称: 策略分效果评估
        执行方: skill
        依赖: ["3.4"]
        门禁: true
        可打回至: ["3.4"]
        循环:
          与: "3.4"
          最大轮次: 8
          保留: 基线与最好可行解          # 当前采用可指向更早的最好一轮
          每轮必记: [本轮调整, 复评结果, 接受或拒绝原因]
      - {id: "3.报告整合", 执行方: 报告整合, 依赖: ["3.5"]}
      - id: "3.6"
        名称: 定版与交付
        执行方: 人工
        依赖: ["3.报告整合"]
        门禁: true
        可打回至: ["3.3", "3.4"]
        交接: 策略分

  - id: "4"
    名称: 主策略DB开发
    说明: 全线不回流——区分度或置换不达标不回退到 4.1，作为未解决项写进结论
    默认:
      不达标处理: 带问题通过
    节点:
      - {id: "4.1.1", 名称: DB方案生成, 执行方: 代码, 依赖: ["交接:主B卡", "交接:策略分"]}
      - id: "4.1.2"
        名称: 人工确认
        执行方: 人工
        依赖: ["4.1.1"]
        门禁: true
        结论:
          符合标准: 通过
          还要增加要求: 整改后复验
        可打回至: ["4.1.1"]
        循环: {与: "4.1.1", 最大轮次: 5}
      - id: "4.2-4.3"
        名称: DB策略综合评估
        节点:
          - {id: "4.2", 名称: 区分度与置换, 执行方: skill, 依赖: ["4.1.2"], 待核对: true}
          - {id: "4.3", 名称: 近期结构与综合结论, 执行方: skill, 依赖: ["4.2"], 待核对: true}
      - id: "4.评级内推分"
        执行方: 代码
        依赖: ["4.2"]
        基线: 固定首版
        循环: {与: "4.2", 最大轮次: 8, 保留: 基线与最好可行解}
      - id: "4.报告整合"
        执行方: 报告整合
        依赖: ["4.3", "4.评级内推分"]
        交接: 最终交付
